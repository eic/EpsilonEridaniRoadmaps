name: Intentions

on:
  issue_comment:
    types: [created]
  issues:
    # `labeled` catches the intention issues that label-intentions.yml labels after the fact:
    # they open without `intention`, so the `opened` event fails the auto-add filter below.
    types: [opened, labeled, closed, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  schedule:
    # Every 30 minutes, so short (hour-scale) TTLs are released reasonably promptly.
    # GitHub cron is loose, so release lags somewhat.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  check-auth:
    runs-on: ubuntu-latest
    outputs:
      has_auth: ${{ steps.check.outputs.has_auth }}
    steps:
      - id: check
        env:
          PRIVATE_KEY: ${{ secrets.CLAIMS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${{ vars.CLAIMS_APP_ID }}" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::warning::CLAIMS_APP_ID or CLAIMS_APP_PRIVATE_KEY is not set. Skipping intentions synchronization."
            echo "has_auth=false" >> $GITHUB_OUTPUT
          else
            echo "has_auth=true" >> $GITHUB_OUTPUT
          fi

  intentions:
    needs: check-auth
    if: needs.check-auth.outputs.has_auth == 'true'
    permissions:
      issues: write
      pull-requests: write
    uses: leanprover-community/intentions/.github/workflows/intentions.yml@v1
    with:
      project-title: "EpsilonEridani"
      default-ttl: "30d"
      max-ttl: "90d"
      # Only intention issues belong on the board; keep roadmap-feedback / meta off it.
      auto-add-labels: "intention"
      app-id: ${{ vars.CLAIMS_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CLAIMS_APP_PRIVATE_KEY }}
