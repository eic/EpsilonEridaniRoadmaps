name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required so `build` reports inside a merge queue. Without it the queue's `gh-readonly-queue/...`
  # ref runs no CI at all, `build` never arrives, and every queued pull request waits until it times
  # out -- which is why this had to land before the queue was turned on, and why removing it now
  # would wedge the queue rather than merely skip a check.
  #
  # The queue is what stops a stale branch reddening `main`. `pull_request` tests a merge of the
  # branch with `main` as it was when CI last ran, and the `main` ruleset does not require a branch
  # to be up to date (`strict_required_status_checks_policy` is off, which is correct once a queue
  # exists and would otherwise force a rebase before every merge). A pull request can therefore be
  # green against a month-old base and still break `main` on merge. That is exactly how `main` broke
  # on 2026-09-14: #350 archived `EpsilonEridaniRoadmap/IntegralLattices/Suggested.lean` to `Completed/` on
  # the 10th, #218 -- opened on 2026-08-13 and never retested -- merged on the 14th still importing
  # the old path, and each was green alone. The queue tests the result of merging, in order, so the
  # combination is what has to pass.
  merge_group:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install Lean and materialize the dependency workspace. This restores Mathlib through its
      # own cache (`lake exe cache get Mathlib Physlib EpsilonEridani`) but deliberately leaves the project build to the final step.
      - name: Set up Lean and restore Mathlib
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Fetch Dependencies cache
        run: |
          if ! lake exe cache get Mathlib Physlib TauCeti; then
            echo "::warning::lake exe cache get failed; forcing a full refetch"
            lake exe cache get! Mathlib Physlib TauCeti
          fi

      # Mathlib's cache tool restores only Mathlib and its own dependencies, so Physlib (~1,300
      # CPU-seconds) and TauCeti were compiled from source on every run. Restore their `.lake/build`
      # trees from the snapshot that `main`'s own build saves (see "Save dependency builds" below),
      # as EpsilonEridani's CI does. EpsilonEridani is excluded: its outputs come from its Lake
      # artifact cache in the next step. The script validates every archive member before
      # extracting any, and Lake still checks each module's trace, so an output that is stale after
      # a pin bump is rebuilt, not trusted. Best-effort: on a miss or a refused archive the build
      # compiles from source as before. The archive path is fixed because actions/cache hashes
      # `path` into the entry's version.
      - name: Test the dependency-build archiver
        run: python3 .github/scripts/test_dependency_builds.py

      # The key is computed in its own step so that `main` can still save a snapshot when the
      # restore itself errors (its outputs are then unset).
      - name: Compute the dependency-build cache key
        id: dependency_builds_key
        env:
          PREFIX: dependency-builds-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
          MANIFEST: ${{ hashFiles('lake-manifest.json') }}
        run: |
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$PREFIX$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Restore dependency builds
        id: dependency_builds_restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dependency-builds.tar
          key: ${{ steps.dependency_builds_key.outputs.key }}
          restore-keys: |
            ${{ steps.dependency_builds_key.outputs.prefix }}

      - name: Unpack dependency builds
        if: ${{ steps.dependency_builds_restore.outputs.cache-matched-key != '' }}
        env:
          ARCHIVE: ${{ runner.temp }}/dependency-builds.tar
        run: |
          if ! python3 .github/scripts/dependency_builds.py --exclude EpsilonEridani unpack . "$ARCHIVE"; then
            echo "::warning::dependency-build archive refused or unreadable; compiling dependencies from source"
          fi

      # Fetch EpsilonEridani's cache map from its public Lake service. Artifacts stay lazy: the build
      # downloads only the EpsilonEridani modules it actually imports. This is distinct from Mathlib's
      # cache above, and avoids making every package in the workspace cache-writable.
      - name: Fetch EpsilonEridani cache map
        id: epsiloneridani_cache
        shell: bash
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_ARTIFACT_ENDPOINT" ] || [ -z "$PUBLIC_REVISION_ENDPOINT" ]; then
            echo "::warning::EpsilonEridani artifact cache endpoints are not configured; building from source"
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          config="$RUNNER_TEMP/epsiloneridani-lake-cache.toml"
          cache_dir="$GITHUB_WORKSPACE/.lake/cache"
          cat > "$config" <<TOML
          cache.defaultService = "epsiloneridani-public"
          [[cache.service]]
          name = "epsiloneridani-public"
          kind = "s3"
          artifactEndpoint = "$PUBLIC_ARTIFACT_ENDPOINT"
          revisionEndpoint = "$PUBLIC_REVISION_ENDPOINT"
          TOML

          discard_cache() {
            [ -e "$cache_dir" ] || return 0
            stale="$cache_dir.discard.$$"
            if mv "$cache_dir" "$stale" 2>/dev/null; then
              rm -rf "$stale" 2>/dev/null || true
            else
              rm -rf "$cache_dir" 2>/dev/null || true
            fi
          }

          clean=0
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            discard_cache
            log="$RUNNER_TEMP/epsiloneridani-cache-get-$attempt.log"
            rc=0
            LAKE_CONFIG="$config" LAKE_CACHE_DIR="$cache_dir" \
                lake cache get --package=EpsilonEridani --service=epsiloneridani-public \
                  --repo=eic/EpsilonEridani --mappings-only --max-revs=20 \
                  > "$log" 2>&1 || rc=$?
            cat "$log"

            if [ "$rc" = 0 ]; then
              clean=1
              break
            fi
            if grep -q 'no outputs found' "$log"; then
              break
            fi
            if [ "$attempt" != "$attempts" ]; then
              echo "::notice::EpsilonEridani cache-map fetch attempt $attempt failed; retrying from an empty cache"
              sleep 2
            fi
          done

          if [ "$clean" = 1 ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            {
              echo "LAKE_CONFIG=$config"
              echo "LAKE_CACHE_DIR=$cache_dir"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::EpsilonEridani cache map unavailable; building from source"
            discard_cache
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      # Build only. The roadmap's Lean targets carry `sorry` on purpose (they are goals),
      # so there is no axiom audit or warning-as-error here.
      - name: Build
        run: lake build

      # The only writer of the dependency-build cache: a push to `main`, after its build succeeded.
      # Pull requests and the merge queue restore it read-only, so a pull request cannot plant
      # outputs that later builds consume. An exact hit is immutable and already holds this pin's
      # builds; otherwise (a pin bump, or a prefix restore) save under the exact key. Never fails
      # the job.
      - name: Pack dependency builds
        if: ${{ github.event_name == 'push' && steps.dependency_builds_restore.outputs.cache-hit != 'true' }}
        id: dependency_builds_pack
        continue-on-error: true
        env:
          ARCHIVE: ${{ runner.temp }}/dependency-builds.tar
        run: python3 .github/scripts/dependency_builds.py --exclude EpsilonEridani pack . "$ARCHIVE"

      - name: Save dependency builds
        if: ${{ github.event_name == 'push' && steps.dependency_builds_pack.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dependency-builds.tar
          key: ${{ steps.dependency_builds_key.outputs.key }}

      # Keep degradation visible without turning a cache-service outage into a correctness failure.
      - name: Report EpsilonEridani cache use
        if: ${{ always() && steps.epsiloneridani_cache.outputs.enabled == '1' }}
        shell: bash
        run: |
          count=0
          if [ -d "$LAKE_CACHE_DIR/artifacts" ]; then
            count=$(find "$LAKE_CACHE_DIR/artifacts" -type f | wc -l)
          fi
          if [ "$count" -eq 0 ]; then
            echo "::warning::EpsilonEridani cache map was found, but the build restored no artifacts"
          else
            echo "::notice::The build restored $count EpsilonEridani artifact archive(s)"
          fi
